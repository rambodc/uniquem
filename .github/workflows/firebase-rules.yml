name: Production - Firebase Rules
on:
  push:
    branches: [production]
    paths: ["firestore.rules", "firestore.indexes.json", "storage.rules", "firebase.json", ".firebaserc", ".github/workflows/firebase-rules.yml"]
  workflow_dispatch:
concurrency: { group: uniquem-rules-production, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Prod
    permissions: { id-token: write, contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Validate deployment identity
        run: |
          test -n "${{ secrets.GCP_WIF_PROVIDER }}" || { echo "Missing GCP_WIF_PROVIDER in the Prod environment"; exit 1; }
          test -n "${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}" || { echo "Missing GCP_SERVICE_ACCOUNT_EMAIL in the Prod environment"; exit 1; }
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          workload_identity_provider: "${{ secrets.GCP_WIF_PROVIDER }}"
          service_account: "${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}"
      - run: npm install --global firebase-tools@14.15.2
      - run: firebase deploy --token "${{ steps.auth.outputs.access_token }}" --only firestore:rules,firestore:indexes,storage --project uniquem-4366e --non-interactive --force --message "CI rules deploy"
