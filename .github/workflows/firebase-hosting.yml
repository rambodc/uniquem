name: Production - Firebase Hosting
on:
  push:
    branches: [production]
    paths: ["src/**", "public/**", "index.html", "package.json", "package-lock.json", "vite.config.ts", "tsconfig*.json", "firebase.json", ".firebaserc", ".github/workflows/firebase-hosting.yml"]
  workflow_dispatch:
concurrency: { group: uniquem-hosting-production, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Prod
    permissions: { id-token: write, contents: read }
    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: google-github-actions/auth@v2
        with: { workload_identity_provider: "${{ secrets.GCP_WIF_PROVIDER }}", service_account: "${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}" }
      - run: npm ci
      - run: npm run lint && npm run build
      - run: npm install --global firebase-tools@14.15.2
      - run: firebase deploy --only hosting --project uniquem-4366e --non-interactive --message "CI hosting deploy"
