name: iOS compile check (temporary)
on: { push: { branches: [ios-app] } }
jobs:
  compile:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -destination "generic/platform=iOS" CODE_SIGNING_ALLOWED=NO archive -archivePath "$RUNNER_TEMP/check.xcarchive"
