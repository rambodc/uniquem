name: iOS - TestFlight
# Builds the native iOS app (Capacitor, bundled website build), signs it with the Apple Distribution certificate and the
# "Uniquem App Store" profile (no registered devices needed) and uploads it to TestFlight with the App Store Connect API key.
# Manual only: Actions → iOS - TestFlight → Run workflow.
# Repository secrets: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (the .p8 text, or base64 of it),
# IOS_DIST_P12 (base64 .p12 of the distribution cert + key), IOS_DIST_P12_PASSWORD, IOS_APPSTORE_PROFILE (base64 .mobileprovision).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "App version shown in TestFlight (CFBundleShortVersionString)"
        required: true
        default: "1.0.0"
      compile_only:
        description: "Only check that the app compiles (simulator build, no signing, no secrets, no upload)"
        type: boolean
        default: false
concurrency: { group: uniquem-ios-testflight, cancel-in-progress: false }
jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 60
    permissions: { contents: read }
    env:
      TEAM_ID: 3CW838WDQC
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - name: Check signing secrets
        if: ${{ !inputs.compile_only }}
        env:
          ASC_KEY_P8: "${{ secrets.ASC_KEY_P8 }}"
          IOS_DIST_P12: "${{ secrets.IOS_DIST_P12 }}"
          IOS_DIST_P12_PASSWORD: "${{ secrets.IOS_DIST_P12_PASSWORD }}"
          IOS_APPSTORE_PROFILE: "${{ secrets.IOS_APPSTORE_PROFILE }}"
        run: |
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 IOS_DIST_P12 IOS_DIST_P12_PASSWORD IOS_APPSTORE_PROFILE; do test -n "${!name}" || { echo "Missing repository secret $name"; exit 1; }; done
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: Compile only (simulator, unsigned)
        if: ${{ inputs.compile_only }}
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -destination "generic/platform=iOS Simulator" CODE_SIGNING_ALLOWED=NO build
      - name: Write the API key
        if: ${{ !inputs.compile_only }}
        env: { ASC_KEY_P8: "${{ secrets.ASC_KEY_P8 }}" }
        run: |
          key="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          if printf '%s' "$ASC_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then printf '%s\n' "$ASC_KEY_P8" > "$key"; else printf '%s' "$ASC_KEY_P8" | base64 --decode > "$key"; fi
          chmod 600 "$key"
          echo "ASC_KEY_PATH=$key" >> "$GITHUB_ENV"
      - name: Install the distribution certificate and profile
        if: ${{ !inputs.compile_only }}
        env:
          IOS_DIST_P12: "${{ secrets.IOS_DIST_P12 }}"
          IOS_DIST_P12_PASSWORD: "${{ secrets.IOS_DIST_P12_PASSWORD }}"
          IOS_APPSTORE_PROFILE: "${{ secrets.IOS_APPSTORE_PROFILE }}"
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_pass="$(uuidgen)"
          security create-keychain -p "$keychain_pass" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_pass" "$keychain"
          printf '%s' "$IOS_DIST_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$keychain" -P "$IOS_DIST_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/dist.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_pass" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          profiles="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$profiles"
          printf '%s' "$IOS_APPSTORE_PROFILE" | base64 --decode > "$profiles/uniquem-app-store.mobileprovision"
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - name: Archive (Apple Distribution, manual signing)
        if: ${{ !inputs.compile_only }}
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination generic/platform=iOS -archivePath "$RUNNER_TEMP/Uniquem.xcarchive" \
            MARKETING_VERSION="${{ inputs.version }}" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive
      - name: Export and upload to TestFlight
        if: ${{ !inputs.compile_only }}
        run: |
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Uniquem.xcarchive" -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Remove the API key and signing keychain
        if: always()
        run: |
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP/dist.p12"
          if [ -n "$SIGNING_KEYCHAIN" ]; then security delete-keychain "$SIGNING_KEYCHAIN" || true; fi
