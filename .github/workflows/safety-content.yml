name: Production - Safety content
on:
  push:
    branches: [production]
    paths: ["safety-content/**", "scripts/load-safety-content.mjs", "functions/safety.js", ".github/workflows/safety-content.yml"]
  workflow_dispatch:
concurrency: { group: uniquem-safety-content-production, cancel-in-progress: false }
jobs:
  load:
    runs-on: ubuntu-latest
    environment: Prod
    permissions: { id-token: write, contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: functions/package-lock.json }
      - name: Validate deployment identity
        run: |
          test -n "${{ secrets.GCP_WIF_PROVIDER }}" || { echo "Missing GCP_WIF_PROVIDER in the Prod environment"; exit 1; }
          test -n "${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}" || { echo "Missing GCP_SERVICE_ACCOUNT_EMAIL in the Prod environment"; exit 1; }
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "${{ secrets.GCP_WIF_PROVIDER }}"
          service_account: "${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}"
      - run: npm ci --prefix functions
      - run: node scripts/load-safety-content.mjs --check
      - run: node scripts/load-safety-content.mjs
